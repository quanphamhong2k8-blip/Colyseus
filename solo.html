(()=>{
const R_P=6.6,R_E=4.87025,R_Q=12.32,FD=R_P,CD_P=5,CD_Q=5,CD_E=1,ARENA=110; // Phạm vi chiêu 2 tăng 10%

// Tăng sáng mô hình nhẹ nhàng, vẫn giữ màu và texture gốc.
function brightenModel(model){
 model.traverse(o=>{
  if(!o.isMesh||!o.material)return;
  const mats=Array.isArray(o.material)?o.material:[o.material];
  for(const mat of mats){
   // Nâng độ sáng tổng thể vừa phải, giữ màu gốc và tăng ánh sáng tự phát nhẹ.
   if(mat.color)mat.color.multiplyScalar(1.1);
   if(mat.emissive){mat.emissive.setRGB(.11,.11,.11);mat.emissiveIntensity=.58;}
   mat.needsUpdate=true;
  }
 });
}
function makeSword(col){
 // Hình nón cụt dài hẹp + hỗ trợ đổi màu/sáng khi nội tại
 const g=new THREE.Group();
 const len=1.44, rBase=.055, rTip=.012; // dài hẹp, thuôn dần
 const mat=new THREE.MeshLambertMaterial({color:col,emissive:0x000000,emissiveIntensity:0});
 // Nón cụt dọc trục Y rồi xoay sang Z
 const blade=new THREE.Mesh(new THREE.CylinderGeometry(rTip,rBase,len,8),mat);
 blade.rotation.x=Math.PI/2;g.add(blade);
 // Đầu nhọn nhỏ
 const tip=new THREE.Mesh(new THREE.ConeGeometry(rTip*1.15,.12,6),mat);
 tip.rotation.x=Math.PI/2;tip.position.z=len/2+.05;g.add(tip);
 // Cận kiếm
 const guard=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.04,8),new THREE.MeshLambertMaterial({color:0x8899aa}));
 guard.rotation.x=Math.PI/2;guard.position.z=-len/2;g.add(guard);
 g.userData.glowMat=mat;g.userData.baseCol=col;
 return g;
}

const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z),clamp=v=>Math.max(-ARENA,Math.min(ARENA,v));

// Model sanji.glb (tai tu CDN, co URL du phong)
(()=>{const URLS=['https://cdn.jsdelivr.net/gh/quanphamhong2k8-blip/khomohinh3D@main/sanji.glb','https://raw.githubusercontent.com/quanphamhong2k8-blip/khomohinh3D/main/sanji.glb'];
 const tryLoad=i=>{if(i>=URLS.length)return console.error('GLB loi: tai that bai moi URL');
 new THREE.GLTFLoader().load(URLS[i],g=>{const m=g.scene;m.scale.setScalar(1.44);let rh=null;
  brightenModel(m);

  hero.add(m);mdl=m;gltfD=g;body.visible=head.visible=false;

  for(const c of g.animations){c.tracks.forEach(t=>{if(/Hips.*\.position$/.test(t.name)){const v=t.values,x=v[0],z=v[2];for(let i=0;i<v.length;i+=3){v[i]=x;v[i+2]=z}}});acts[c.name.trim().toLowerCase()]=mixer.clipAction(c)}
  go('idle')},undefined,()=>{console.warn('GLB: loi tai '+URLS[i]+', thu URL du phong');tryLoad(i+1)})};
 tryLoad(0)})();
function ring(r,col,op){const m=new THREE.Mesh(new THREE.RingGeometry(r-.1,r,64),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.y=.06;return m}
const ringP=ring(R_P,0xff7ab8,.2),ringE=ring(R_E,0xffffff,0);hero.add(ringP,ringE);
// Effects
const fx=[];
// Vệt lướt đỏ là một dải liên tục được VẼ THEO QUỸ ĐẠO LƯNG nhân vật,
// tương tự vệt kiếm bám theo mũi kiếm; không tạo các vệt/ảnh rời.
const dashTrail={points:[],mesh:null,active:false,lastX:0,lastZ:0};
{
 const geo=new THREE.BufferGeometry();
 const mat=new THREE.MeshBasicMaterial({color:0xd41436,transparent:true,opacity:.95,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending});
 dashTrail.mesh=new THREE.Mesh(geo,mat);dashTrail.mesh.frustumCulled=false;dashTrail.mesh.renderOrder=10;scene.add(dashTrail.mesh);
}
function spawnDashFlash(){dashTrail.active=true;}
function updateDashFlashes(dt,T){
 const moving=!!lunge||dashT>0;
 if(moving){
  // Điểm bám ở chính giữa phần lưng mô hình: lùi khỏi tâm nhân vật theo hướng quay.
  const rot=hero.rotation.y;
  const x=pos.x-Math.sin(rot)*.48, z=pos.z-Math.cos(rot)*.48;
  const last=dashTrail.points[dashTrail.points.length-1];
  if(!last||Math.hypot(x-last.x,z-last.z)>.025)dashTrail.points.push({x,z,t:T});
  dashTrail.active=true;
 }
 dashTrail.points=dashTrail.points.filter(p=>T-p.t<.30);
 const pts=dashTrail.points, geo=dashTrail.mesh.geometry;
 if(pts.length<2){geo.setAttribute('position',new THREE.Float32BufferAttribute([],3));dashTrail.mesh.material.opacity=0;return;}
 const verts=[],indices=[];
 for(let i=0;i<pts.length;i++){
  const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
  let dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz)||1;const nx=-dz/len,nz=dx/len;
  const age=(T-p.t)/.30, taper=Math.max(.08,1-age);
  const width=.22*taper;
  // Nâng dải vệt lên giữa phía sau mô hình thay vì nằm sát mặt đất.
  const trailY=.82;
  verts.push(p.x+nx*width,trailY,p.z+nz*width,p.x-nx*width,trailY,p.z-nz*width);
  if(i<pts.length-1){const k=i*2;indices.push(k,k+1,k+2,k+1,k+3,k+2);}
 }
 geo.dispose();dashTrail.mesh.geometry=new THREE.BufferGeometry();
 dashTrail.mesh.geometry.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));dashTrail.mesh.geometry.setIndex(indices);dashTrail.mesh.geometry.computeVertexNormals();
 dashTrail.mesh.material.opacity=Math.max(.05, .95*(1-(T-pts[0].t)/.36));
 if(!moving&&pts.length===0)dashTrail.active=false;
}
function burst(x,z,r,col,f,d,s){
 while(fx.length>20){const o=fx.shift();scene.remove(o.m);if(o.m.geometry)o.m.geometry.dispose();if(o.m.material)o.m.material.dispose()}
 const m=new THREE.Mesh(new THREE.RingGeometry(.85,1,32),new THREE.MeshBasicMaterial({color:col,transparent:true,side:THREE.DoubleSide,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,.1,z);m.scale.setScalar(.2);scene.add(m);fx.push({m,r,t:0,f,d:d||.3,s:s==null?.2:s})}
// Vệt đâm thẳng xuyên qua mục tiêu và vọt hẳn ra phía sau trong tích tắc.
const passiveImpacts=[];
// Hiệu ứng đâm nội tại bắt đầu đúng tại mũi kiếm và kéo xuyên tới mục tiêu.
function passiveImpact(sx,sy,sz,ex,ez,dx,dz){
 const len=Math.max(1.6,Math.hypot(ex-sx,ez-sz)*1.45+2.0); // Vệt đâm dài hơn, xuyên qua mục tiêu và vọt xa phía sau
 const g=new THREE.Group();g.position.set(sx,Math.max(.72,Math.min(1.55,sy)),sz);g.rotation.y=Math.atan2(dx,dz);
 const streaks=[];
 // Tạo thân đâm thuôn nhọn ở CẢ HAI đầu, trục dọc theo Z để bám hướng kiếm.
 const addStreak=(w,h,l,col,opacity,localZ)=>{
  const geo=new THREE.BufferGeometry(),verts=[],indices=[];const sides=8;
  const rings=[{z:0,r:.015},{z:l*.10,r:1},{z:l*.84,r:.72},{z:l,r:.008}];
  for(const ring of rings){for(let j=0;j<sides;j++){const a=j*Math.PI*2/sides;verts.push(Math.cos(a)*w*.5*ring.r,Math.sin(a)*h*.5*ring.r,ring.z)}}
  for(let r=0;r<rings.length-1;r++)for(let j=0;j<sides;j++){const a=r*sides+j,b=r*sides+(j+1)%sides,c=(r+1)*sides+j,d=(r+1)*sides+(j+1)%sides;indices.push(a,b,c,b,d,c)}
  geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));
  m.position.set(0,0,localZ);g.add(m);streaks.push(m);return m;
 };
 // Viền hồng và lõi trắng đều thuôn thành mũi nhọn, tạo cảm giác đâm xuyên sắc gọn.
 addStreak(.28,.18,len,0xff4fa8,.98,0);
 addStreak(.13,.105,len*.99,0xffffff,1,.01);
 addStreak(.42,.045,len*.88,0xffa9d5,.82,len*.06);
 // Chỉ giữ lại vệt đâm; bỏ chớp cầu tại điểm trúng và toàn bộ hạt cầu bay tỏa ra.
 scene.add(g);passiveImpacts.push({g,t:0,d:.14});
 while(passiveImpacts.length>12){const old=passiveImpacts.shift();scene.remove(old.g);disposeObj(old.g)}
}
function updatePassiveImpacts(dt){
 for(let i=passiveImpacts.length-1;i>=0;i--){const f=passiveImpacts[i];f.t+=dt;const k=Math.max(0,1-f.t/f.d);
  const grow=f.t<.035?1.12:1;f.g.scale.set(grow,grow,grow);
  f.g.traverse(o=>{if(o.isMesh&&o.material)o.material.opacity=Math.max(0,k)});
  if(f.t>=f.d){scene.remove(f.g);disposeObj(f.g);passiveImpacts.splice(i,1)}
 }
}
// Vệt kiếm đỏ cho chiêu 2 và nội tại: bám theo quỹ đạo đầu kiếm, cong và thuôn hai đầu
const slashTrail={points:[],mesh:null,active:false,lastAnim:false};
(function initSlashTrail(){
 const g=new THREE.BufferGeometry();
 const m=new THREE.MeshBasicMaterial({color:0x5c000f,transparent:true,opacity:1,side:THREE.DoubleSide,depthWrite:false,blending:THREE.NormalBlending});
 slashTrail.mesh=new THREE.Mesh(g,m);slashTrail.mesh.frustumCulled=false;slashTrail.mesh.renderOrder=8;scene.add(slashTrail.mesh);
})();
function updateSlashTrail(dt,T){
 const active=(cur==="chieu2"||cur==="noitai")&&oneT>0&&sword&&sword.parent;
 if(active){
  sword.updateMatrixWorld(true);
  const tip=new THREE.Vector3(0,0,0.78).applyMatrix4(sword.matrixWorld);
  const prev=slashTrail.points[slashTrail.points.length-1];
  if(!prev||tip.distanceTo(prev.p)>.035)slashTrail.points.push({p:tip.clone(),t:T});
 }else if(slashTrail.lastAnim){
  // Giữ vệt lại rất ngắn sau khi kết thúc hoạt ảnh
 }
 slashTrail.lastAnim=!!active;
 slashTrail.points=slashTrail.points.filter(v=>T-v.t<.24);
 const pts=slashTrail.points;
 const geom=slashTrail.mesh.geometry;
 if(pts.length<2){geom.setAttribute('position',new THREE.Float32BufferAttribute([],3));geom.setIndex([]);return}
 const verts=[],idx=[],camDir=new THREE.Vector3();
 cam.getWorldDirection(camDir);
 for(let i=0;i<pts.length;i++){
  const tangent=new THREE.Vector3();
  if(i===0)tangent.subVectors(pts[1].p,pts[0].p);
  else if(i===pts.length-1)tangent.subVectors(pts[i].p,pts[i-1].p);
  else tangent.subVectors(pts[i+1].p,pts[i-1].p);
  if(tangent.lengthSq()<1e-8)tangent.set(1,0,0);else tangent.normalize();
  let side=new THREE.Vector3().crossVectors(tangent,camDir);
  if(side.lengthSq()<1e-6)side.set(-tangent.z,0,tangent.x);
  side.normalize();
  const u=i/(pts.length-1);
  // Hai đầu nhọn, thân giữa dày như vệt cắt trong ảnh
  const taper=Math.pow(Math.sin(Math.PI*u),.72);
  const width=(.035+1.05*taper)*(0.55+0.45*Math.min(1,pts.length/8))*0.214; // tăng độ dày thêm 7% so với mức 20% trước đó
  const age=Math.max(0,1-(T-pts[i].t)/.24);
  const w=width*Math.sqrt(age);
  const center=pts[i].p;
  verts.push(center.x+side.x*w,center.y+side.y*w,center.z+side.z*w);
  verts.push(center.x-side.x*w*.72,center.y-side.y*w*.72,center.z-side.z*w*.72);
  if(i<pts.length-1){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
 }
 geom.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
 geom.setIndex(idx);geom.computeVertexNormals();
 slashTrail.mesh.material.opacity=.98;
}

 const geo=new THREE.ShapeGeometry(shape,16),mat=new THREE.MeshBasicMaterial({color:0x390008,transparent:true,opacity:1,side:THREE.DoubleSide,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-3});

for(let i=0;i<14;i++){const g=new THREE.Group(),m=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,1.8,10),L(0xd04040));m.position.y=.9;

  if(k!==lastP){lastP=k;lastSend=0;lastAc=ac;lsX=pos.x;lsZ=pos.z;lsT=nowT;o.ts=Date.now()+offs;ns('p',o)}}
 if(isHost){lastMob+=dt;const sig=mobs.map(e=>e.hp+(e.dead>0?'d':'')).join();
  if(lastMob>=.066&&(sig!==lastMs||lastMob>=.2)){const a=mobs.map(e=>[+e.g.position.x.toFixed(1),+e.g.position.z.toFixed(1),e.hp,e.dead>0?1:0,+(e.vx||0).toFixed(2),+(e.vz||0).toFixed(2)]),k=JSON.stringify(a);
   lastMob=0;if(k!==lastMk||sig!==lastMs){lastMk=k;lastMs=sig;ns('m',a)}}}}
function onEv(v){if(!v||v.f===myId||v.t<tJoin-500)return;
 if(v.k==='s'){const m=new THREE.Mesh(new THREE.SphereGeometry(.4,10,8),new THREE.MeshBasicMaterial({color:0xff3030}));
  // Bù trễ đạn: đẩy viên đạn tới vị trí nó đáng ra đã bay tới.
  const lag=Math.max(0,Math.min(.3,(Date.now()+offs-v.t)/1000)),adv=36*lag;
  m.position.set(v.x+v.dx*adv,1.2,v.z+v.dz*adv);scene.add(m);shots.push({m,d:new THREE.Vector3(v.dx,0,v.dz),s:adv,vis:1,owner:v.f})}
 else if(v.k==='d'&&v.to===myId&&pdead<=0){hp=Math.max(0,hp-v.d);updHp();if(hp<=0){pdead=3;hero.visible=false;lunge=null}}
 else if(v.k==='pi'){passiveImpact(v.sx,v.sy,v.sz,v.ex,v.ez,v.dx,v.dz)}
 else if(v.k==='b'){const r=remotes[v.f];if(r)r.bT=.35;burst(v.x,v.z,v.r,0xff3030,v.fl&&r?r:0,v.d,v.s)}
 else if(v.k==='f')mkFlower(v.x,v.z,1,true,v.sx,v.sz);
 else if(v.k==='fp'){ // đối thủ nhặt bông → xóa bông tương ứng trên máy mình
  for(let i=flowers.length-1;i>=0;i--){const f=flowers[i];
   if((v.id&&f.id===v.id)||(Math.abs(f.x-v.x)<.6&&Math.abs(f.z-v.z)<.6)){
    const fx=f.g.position.x,fz=f.g.position.z;scene.remove(f.g);flowers.splice(i,1);burst(fx,fz,1.8,0xff3030,0,.25,.2)}}
 }
 else if(v.k==='fc'){clearFlowers(true);
  // Người ném báo đã trúng: xóa viên đạn đang bay của họ (không để xuyên người); nếu trúng mình thì hiện va chạm trên người mình.
  let gone=0;for(let i=shots.length-1;i>=0;i--){const s=shots[i];if(!s.vis||s.owner!==v.f)continue;
   if(v.to===myId){s.m.position.x=pos.x;s.m.position.z=pos.z}
   scene.remove(s.m);if(s.m.geometry)s.m.geometry.dispose();if(s.m.material)s.m.material.dispose();shots.splice(i,1);gone++}
  if(gone&&v.to===myId&&pdead<=0)spawnDamageImpact({g:hero,bag:0})} // đối thủ trúng địch tạo 3 bông mới → xóa bông cũ
 else if(v.k==='m'&&isHost){const e=mobs[v.i];if(e&&!e.dead)hit(e,v.d)}}
async function join(c,mk){
 if(!window.Colyseus?.Client){alert('Không tải được Colyseus');return}
 code=c;$('rj').disabled=$('rn').disabled=true;
 try{
   const cl=new window.Colyseus.Client(CS_URL);
   room=mk?await cl.create(CS_ROOM,{code:c}):await cl.joinOrCreate(CS_ROOM,{code:c});
   myId=room.sessionId;const jl={};
   const calcHost=()=>{let best=null,bj=0;for(const id in jl){const j=jl[id];if(best===null||j<bj||(j===bj&&id<best)){best=id;bj=j}}isHost=best===null||best===myId;updLabel()};
   const proc=(id,d)=>{if(!d||id===myId)return;let r=remotes[id];
    if(!r){r=remotes[id]=mkRemote(id);enemies.push(r);r.g.position.set(d.x,0,d.z);r.g.rotation.y=d.r;r.c=d.c} // vào phòng: không phát lại chiêu cũ
    const sNow=Date.now()+offs,lat=d.ts?Math.max(0,Math.min(.35,(sNow-d.ts)/1000)):0;
    if(d.ts)ping=ping?ping*.85+lat*150:lat*1000;
    const vx=Math.max(-40,Math.min(40,d.vx||0)),vz=Math.max(-40,Math.min(40,d.vz||0));
    // Lưu gói theo mốc thời gian của người gửi; gói đến muộn/sai thứ tự bị bỏ để không giật lùi.
    const t=(d.ts||sNow)/1000,sn=r.snaps,last=sn[sn.length-1];
    if(!last||t>last.t){
     const dl=performance.now()/1000-t; // độ trễ tương đối (không phụ thuộc lệch đồng hồ hai máy)
     if(r.base==null){r.base=dl;r.jit=.015;r.gap=.05;r.dly=.1}
     else if(dl<r.base||dl-r.base>.6)r.base=dl; // gói nhanh nhất = mốc gốc; treo máy/đổi mạng → đồng bộ lại
     else r.base+=(dl-r.base)*.004; // trôi chậm lên để bù lệch tốc độ đồng hồ
     const q=dl-r.base;r.jit+=(q-r.jit)*(q>r.jit?.3:.02); // độ rung mạng: tăng nhanh, giảm chậm
     if(last&&t-last.t<.12)r.gap+=(t-last.t-r.gap)*.1; // nhịp gói thực tế
     sn.push({t,x:d.x,z:d.z,vx,vz,r:d.r,lx:d.lx,lz:d.lz,tp:!!last&&Math.hypot(d.x-last.x,d.z-last.z)>9});while(sn.length>12)sn.shift()}
    if(d.h<r.hp&&r.pend)r.pend=Math.max(0,r.pend-(r.hp-d.h)); // đối soát dự đoán sát thương
    r.hp=d.h;
    if(d.c!==r.c)rAttack(r,d.a,d.c)};
   room.onMessage('p',d=>{const id=d.id,nw=!(id in jl);jl[id]=d.j||0;proc(id,d);if(nw)calcHost()});
   room.onMessage('leave',id=>{delete jl[id];const r=remotes[id];
    if(r){scene.remove(r.g);scene.remove(r.bars);if(r.slashMesh){scene.remove(r.slashMesh);disposeObj(r.slashMesh)}const i=enemies.indexOf(r);if(i>=0)enemies.splice(i,1);delete remotes[id]}calcHost()});
   room.onMessage('m',v=>{if(isHost)return;if(v){
    // Đối soát dự đoán: máu thật đã giảm thì bớt phần dự đoán tương ứng để không trừ đôi.
    for(let i=0;i<v.length;i++){const m=mobs[i],o=mobT[i];if(m&&m.pend&&o&&v[i]&&o[2]>v[i][2])m.pend=Math.max(0,m.pend-(o[2]-v[i][2]))}
    mobT=v;mobTs=performance.now()}});
   room.onMessage('e',onEv);
   room.onMessage('pong',d=>{if(pongCb)pongCb(d.s)});
   room.onLeave(()=>{if(online){online=false;alert('Mất kết nối với server')}});
   addEventListener('pagehide',()=>{try{room.leave()}catch(e){}});
   await syncClock();
   myJ=tJoin=Date.now()+offs;jl[myId]=myJ;
   const o={x:+pos.x.toFixed(1),z:+pos.z.toFixed(1),r:0,a:'idle',c:0,h:hp,j:myJ};lastP=JSON.stringify(o);o.ts=Date.now()+offs;
   ns('p',o);ns('ready',1); // báo server gửi trạng thái người chơi/quái hiện có
   mobs=enemies.filter(e=>e.mid!=null);online=true;netLock=false;$('net').style.display='none';$('hp').style.display='block';updHp();calcHost();
 }catch(e){alert('Lỗi Colyseus: '+(e&&e.message||e));$('rj').disabled=$('rn').disabled=false;room=null}}
$('ro').onclick=()=>{netLock=false;$('net').style.display='none'};
$('rn').onclick=()=>{const c=String(1000+Math.floor(Math.random()*9000));$('rc').value=c;join(c,true)};
$('rj').onclick=()=>{const c=$('rc').value.replace(/\D/g,'');if(!c){$('rc').focus();return}join(c)};
$('rc').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')$('rj').click()});
$('rc').addEventListener('keyup',e=>e.stopPropagation());
loop();
})();
</script></body></html>
