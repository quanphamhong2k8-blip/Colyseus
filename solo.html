<script>
(()=>{
const R_P=7.623,R_E=5.625139*1.15,SPD_K=.9,R_Q=9.96072,SHOT_SPEED=33.6,FD=R_P*0.85,CD_P=5,CD_Q=5.2,CD_E=1.5,CD_E_S=.5,E_WIN=5,ARENA=110; // chiêu 2 tích trữ 3 lần: lần 1,2 hồi CD_E_S (0,5s); lần 3 hồi CD_E (1,5s); E_WIN = thời gian tích trữ mỗi lần (5s) // Tầm ném hoa giảm còn 70% // FD: vòng 3 bông hoa giảm 15%
const $=id=>document.getElementById(id),L=c=>new THREE.MeshLambertMaterial({color:c});
// Tăng sáng mô hình nhẹ nhàng, vẫn giữ màu và texture gốc.
function brightenModel(model){
 model.traverse(o=>{
  if(!o.isMesh||!o.material)return;
  const mats=Array.isArray(o.material)?o.material:[o.material];
  for(const mat of mats){
   // Nâng độ sáng tổng thể vừa phải, giữ màu gốc và tăng ánh sáng tự phát nhẹ.
   if(mat.color)mat.color.multiplyScalar(1.1);
   if(mat.emissive){mat.emissive.setRGB(.11,.11,.11);mat.emissiveIntensity=.58;}
   mat.needsUpdate=true;
  }
 });
}
// Viền vàng kim khi miễn khống: thêm ánh sáng phát ở mép silhouette (Fresnel) vào vật liệu mô hình; goldRimU.value 0..1 điều khiển độ sáng.
const goldRimU={value:0};
function addGoldRim(model){
 model.traverse(o=>{
  if(!o.isMesh||!o.material)return;
  for(const mat of (Array.isArray(o.material)?o.material:[o.material])){
   if(!mat.isMeshStandardMaterial)continue;
   mat.userData.goldRim=true;
   mat.onBeforeCompile=sh=>{
    sh.uniforms.goldRim=goldRimU;
    sh.fragmentShader=sh.fragmentShader.replace('void main() {','uniform float goldRim;\nvoid main() {').replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n float rimD=1.0-abs(dot(normalize(normal),normalize(vViewPosition)));\n totalEmissiveRadiance+=vec3(1.0,.78,.1)*goldRim*(smoothstep(.45,.85,rimD)*1.3+rimD*rimD*.2);');
   };
   mat.needsUpdate=true;
  }
 });
}
// Bot / người chơi khác clone mô hình từ mô hình của mình nên dùng chung vật liệu → tách vật liệu riêng (không có viền) để viền vàng kim chỉ hiện trên nhân vật của mình.
function stripGoldRim(model){
 const f=m=>{if(!m.userData||!m.userData.goldRim)return m;const c=m.clone();c.userData.goldRim=false;return c};
 model.traverse(o=>{if(o.isMesh&&o.material)o.material=Array.isArray(o.material)?o.material.map(f):f(o.material)});
}
// Viền vàng kim riêng cho từng bot / đối thủ (mỗi mô hình một uniform riêng, không ảnh hưởng nhân vật của mình).
function ownGoldRim(model){
 const u={value:0};
 model.traverse(o=>{
  if(!o.isMesh||!o.material)return;
  for(const mat of (Array.isArray(o.material)?o.material:[o.material])){
   if(!mat.isMeshStandardMaterial||!mat.userData||mat.userData.goldRim!==false)continue; // chỉ vật liệu đã tách riêng (stripGoldRim)
   mat.onBeforeCompile=sh=>{
    sh.uniforms.goldRim=u;
    sh.fragmentShader=sh.fragmentShader.replace('void main() {','uniform float goldRim;\nvoid main() {').replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n float rimD=1.0-abs(dot(normalize(normal),normalize(vViewPosition)));\n totalEmissiveRadiance+=vec3(1.0,.78,.1)*goldRim*(smoothstep(.45,.85,rimD)*1.3+rimD*rimD*.2);');
   };
   mat.needsUpdate=true;
  }
 });
 return u;
}
// Vạch miễn khống mỏng dưới thanh máu của bot / đối thủ + cập nhật viền vàng theo e.immuneT.
function addImmBar(e,bars){
 const imBg=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.07),new THREE.MeshBasicMaterial({color:0x050505})),imFg=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.07),new THREE.MeshBasicMaterial({color:0xffc400}));
 imBg.position.y=imFg.position.y=-.135;imFg.position.z=.01;imFg.visible=false;bars.add(imBg,imFg);e.imFg=imFg;e.immuneT=0;e.immMax=ULT_IMMUNE;
}
function updImmFx(e,tm){
 const t=e.immuneT||0;if(t>(e.immMax||0))e.immMax=t;if(t<=0)e.immMax=ULT_IMMUNE;
 if(e.imFg){const k=t>0?Math.min(1,t/Math.max(ULT_IMMUNE,e.immMax)):0;e.imFg.visible=k>0;if(k>0){e.imFg.scale.x=Math.max(.001,k);e.imFg.position.x=-(1-k)*.8}}
 if(e.rimU)e.rimU.value=t>0?(t<.8?(Math.sin(tm*30)>0?1:.35):.85+.15*Math.sin(tm*8)):0;
}
function makeSword(col){
 // Hình nón cụt dài hẹp + hỗ trợ đổi màu/sáng khi nội tại
 const g=new THREE.Group();
 const len=1.44, rBase=.055, rTip=.012; // dài hẹp, thuôn dần
 const mat=new THREE.MeshLambertMaterial({color:col,emissive:0x000000,emissiveIntensity:0});
 // Nón cụt dọc trục Y rồi xoay sang Z
 const bladeGeo=new THREE.CylinderGeometry(rTip,rBase,len,8);
 const blade=new THREE.Mesh(bladeGeo,mat);
 blade.rotation.x=Math.PI/2;g.add(blade);
 // Lớp phủ phát sáng vàng kim riêng biệt để hiệu ứng vẫn nhìn rõ trên model 3D.
 const goldGlowMat=new THREE.MeshBasicMaterial({color:0xffc928,transparent:true,opacity:.92,blending:THREE.AdditiveBlending,depthWrite:false});
 const goldBlade=new THREE.Mesh(new THREE.CylinderGeometry(rTip*1.8,rBase*1.55,len*1.015,8),goldGlowMat);
 goldBlade.rotation.x=Math.PI/2;goldBlade.visible=false;g.add(goldBlade);
 // Đầu nhọn nhỏ
 const tipGeo=new THREE.ConeGeometry(rTip*1.15,.12,6);
 const tip=new THREE.Mesh(tipGeo,mat);
 tip.rotation.x=Math.PI/2;tip.position.z=len/2+.05;g.add(tip);
 const goldTip=new THREE.Mesh(new THREE.ConeGeometry(rTip*2,.15,6),goldGlowMat);
 goldTip.rotation.x=Math.PI/2;goldTip.position.z=len/2+.055;goldTip.visible=false;g.add(goldTip);
 g.userData.goldGlowMeshes=[goldBlade,goldTip];g.userData.goldGlowMat=goldGlowMat;
 // Cận kiếm
 const guard=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.04,8),new THREE.MeshLambertMaterial({color:0x8899aa}));
 guard.rotation.x=Math.PI/2;guard.position.z=-len/2;g.add(guard);
 g.userData.glowMat=mat;g.userData.baseCol=col;
 return g;
}

const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z),clamp=v=>Math.max(-ARENA,Math.min(ARENA,v));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1020);scene.fog=new THREE.Fog(0x0b1020,45,130);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,300);
const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});let PR_MAX=Math.min(devicePixelRatio||1,2),PR=PR_MAX;ren.setPixelRatio(PR);ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xbcd0ff,0x223322,.9));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(10,30,10);scene.add(sun);
// Map
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),L(0x1d3a2a));ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(260,65,0x4a7a5a,0x2c5a3c);grid.position.y=.02;scene.add(grid);
// Đã bỏ toàn bộ cây khỏi địa hình theo yêu cầu.
// Hero
const hero=new THREE.Group(),pos=new THREE.Vector3();
const body=new THREE.Mesh(new THREE.CylinderGeometry(.5,.6,1.4,12),L(0x3a7bff));body.position.y=.7;
const head=new THREE.Mesh(new THREE.SphereGeometry(.4,12,10),L(0xffd9b0));head.position.y=1.8;
const sword=makeSword(0xdfe6ff);sword.position.set(.7,1,.8);
let swordGoldPickupT=0; // Xung phát sáng vàng kim khi nhặt hoa trong lúc miễn nhiễm
hero.add(body,head,sword);scene.add(hero);
// Model sanji.glb (tai tu CDN, co URL du phong)
(()=>{const URLS=['https://cdn.jsdelivr.net/gh/quanphamhong2k8-blip/khomohinh3D@main/sanji.glb','https://raw.githubusercontent.com/quanphamhong2k8-blip/khomohinh3D/main/sanji.glb'];
 const tryLoad=i=>{if(i>=URLS.length)return console.error('GLB loi: tai that bai moi URL');
 new THREE.GLTFLoader().load(URLS[i],g=>{const m=g.scene;m.scale.setScalar(1.44);let rh=null;
  brightenModel(m);addGoldRim(m);
  m.traverse(o=>{if(o.isMesh)o.frustumCulled=false;if(o.isBone&&/RightHand$/.test(o.name))rh=o});
  hero.add(m);mdl=m;gltfD=g;body.visible=head.visible=false;
  if(rh){
    rh.add(sword);rhB=rh;rfa=rh.parent;
    // Giữ nguyên tọa độ kiếm gốc
    sword.position.set(0,.55,0);
    sword.rotation.set(-Math.PI/2,0,0);
    sword.scale.setScalar(1.15);
    sword.userData.basePos = sword.position.clone();
    sword.userData.baseRot = sword.rotation.clone();
  }
  mixer=new THREE.AnimationMixer(m);
  for(const c of g.animations){c.tracks.forEach(t=>{if(/Hips.*\.position$/.test(t.name)){const v=t.values,x=v[0],z=v[2];for(let i=0;i<v.length;i+=3){v[i]=x;v[i+2]=z}}});acts[c.name.trim().toLowerCase()]=mixer.clipAction(c)}
  go('idle')},undefined,()=>{console.warn('GLB: loi tai '+URLS[i]+', thu URL du phong');tryLoad(i+1)})};
 tryLoad(0)})();
function ring(r,col,op){const m=new THREE.Mesh(new THREE.RingGeometry(r-.1,r,64),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.y=.06;return m}
const ringP=ring(R_P,0xff7ab8,.2),ringE=ring(R_E,0xffffff,0);hero.add(ringP,ringE);
// Effects
const fx=[];
// Vệt lướt đỏ là một dải liên tục được VẼ THEO QUỸ ĐẠO LƯNG nhân vật,
// tương tự vệt kiếm bám theo mũi kiếm; không tạo các vệt/ảnh rời.
// Dải vệt dùng lại một buffer cố định (cập nhật tại chỗ) thay vì tạo/hủy BufferGeometry mỗi khung hình:
// cách cũ làm rò rỉ buffer GPU + dồn rác bộ nhớ → giật lag bất thường theo thời gian.
const RIB_PTS=280;
// Vàng kim dạng sợi: lõi sáng, sợi vàng đậm đan xen, viền sợi đen mờ dần
const GOLD_CORE=0xffe66d, GOLD_BRIGHT=0xfff3a8, GOLD_MID=0xd4a020, GOLD_DARK=0x8a6414, GOLD_EDGE=0x1a1000, GOLD_EDGE2=0x2a1808;
// off: lệch ngang theo bề rộng vệt | w: bề rộng sợi | col/op: màu & độ mờ
const GOLD_FIBERS=[
 // Sợi phụ to rõ hơn so với nét vệt đỏ gốc để tạo khác biệt
 {off:.22,w:1.35,col:GOLD_MID,op:.9},
 {off:-.18,w:1.25,col:GOLD_MID,op:.9},
 {off:.48,w:.92,col:GOLD_DARK,op:.78},
 {off:-.38,w:.82,col:GOLD_DARK,op:.78},
 {off:.72,w:.54,col:GOLD_EDGE,op:.62},
 {off:-.55,w:.48,col:GOLD_EDGE,op:.62},
 {off:.95,w:.31,col:GOLD_EDGE,op:.42},
 {off:-.72,w:.28,col:GOLD_EDGE,op:.42},
 // Sợi vàng sáng ở giữa: thu hẹp để nét giữa gọn hơn, vẫn giữ độ sáng
 {off:0,w:.30,col:GOLD_BRIGHT,op:1},
 {off:.12,w:.21,col:GOLD_BRIGHT,op:.95},
 {off:-.1,w:.20,col:GOLD_BRIGHT,op:.95},
 {off:.34,w:.17,col:GOLD_BRIGHT,op:.82},
 {off:-.28,w:.16,col:GOLD_BRIGHT,op:.82}
];
function mkFiberMeshes(order){
 return GOLD_FIBERS.map(f=>{
  const m=new THREE.MeshBasicMaterial({color:f.col,transparent:true,opacity:f.op,side:THREE.DoubleSide,depthWrite:false,blending:THREE.NormalBlending});
  const mesh=new THREE.Mesh(new THREE.BufferGeometry(),m);mesh.frustumCulled=false;mesh.renderOrder=order;mesh.visible=false;scene.add(mesh);
  return {mesh,off:f.off,w:f.w,op:f.op};
 });
}
function setFibersVisible(fibers,on){for(const f of fibers)f.mesh.visible=!!on}
function updateGoldFibers(fibers,pts,sideAt,widthAt,yAt,baseOp){
 if(pts.length<2){setFibersVisible(fibers,false);return}
 const n=pts.length;
 for(const f of fibers){
  const verts=[],idx=[];

function ultFindTarget(dir){
 // Địch (bot / người chơi) nằm trong vùng chữ nhật của mũi tên; chọn kẻ gần nhất theo hướng lao.
 let best=null,bf=Infinity;
 for(const e of enemies){
  if(e.dead||!e.g||!(e.bot||e.remote))continue;
  const rx=e.g.position.x-pos.x,rz=e.g.position.z-pos.z,f=rx*dir.x+rz*dir.z,l=Math.abs(rx*dir.z-rz*dir.x);
  if(f<-ULT_RING||f>uAimReach+ULT_RING||l>uAimWidth/2+ULT_RING)continue; // vùng mũi tên chạm vòng nhân vật địch là tính
  if(f<bf){bf=f;best=e}
 }
 return best;
}
function ultimate(){
 if(netLock||pdead>0||selfStunT>0||cdU>0||lunge||ultWind)return false;
 const dir=aimDir();

 // Nhịp khựng 0,2 giây: lùi ra sau lấy đà, khóa hướng đã chọn (vùng mũi tên vẫn hiện), hết nhịp mới lao.
 ultWind={t:ULT_WINDUP,dir:dir.clone(),ry:Math.atan2(dir.x,dir.z),from:pos.clone()};
 hero.rotation.y=ultWind.ry;dashT=0;faceT=0;pend=null;
 // Animation chieu2: tốc độ chỉnh để trong ULT_WINDUP giây (0,2s) chỉ chạy 25% clip; 75% còn lại kết thúc trong 0,1s khi lao (xem ultStart).

}

function ultLungeStep(dt){
 const L=lunge,te=L.e;

 if(te&&(te.lunge||te.dashT>0)){L.e=null;L.to.set(L.from.x+L.dir.x*uAimReach,0,L.from.z+L.dir.z*uAimReach)}
 if(te&&L.e)L.to.set(te.g.position.x,0,te.g.position.z);
 L.t+=dt/L.dur;
 pos.lerpVectors(L.from,L.to,Math.min(1,L.t));
 hero.rotation.y=te?Math.atan2(te.g.position.x-pos.x,te.g.position.z-pos.z):L.ry;
 // Chạm vòng nhân vật địch (kể cả địch không phải mục tiêu đã chọn) = chạm nhân vật.
 const tg=te||enemies.find(e=>!e.dead&&e.g&&(e.bot||e.remote)&&dist(pos,e.g.position)<=ULT_RING+.1);
 const touch=tg&&dist(pos,tg.g.position)<=ULT_RING+.1;
 if(L.t>=1||touch){
  if(tg)ultTouch(tg,L.dir);
  faceY=hero.rotation.y;faceT=.3;dashT=Math.max(dashT,.28); // nhận 1 nhịp lướt sau cú lao
  lunge=null;
 }
}

function dmgE(e){return DMG_E+DMG_E_PCT*(e.max||HPMAX)} // chiêu 2: 400 cố định + 2% máu tối đa

 // 20 gói/giây; gửi NGAY khi có hành động mới (ac đổi) để đối thủ thấy chiêu không chờ nhịp gửi.
 if(lastSend>=((lunge||dashT>0)?.025:.05)||ac!==lastAc){const nowT=performance.now(),el=Math.max(.016,(nowT-lsT)/1000);
  const vx=pdead>0?0:(pos.x-lsX)/el,vz=pdead>0?0:(pos.z-lsZ)/el;
  const o={x:+pos.x.toFixed(2),z:+pos.z.toFixed(2),vx:+Math.max(-40,Math.min(40,vx)).toFixed(1),vz:+Math.max(-40,Math.min(40,vz)).toFixed(1),r:+hero.rotation.y.toFixed(2),a:cur||'idle',c:ac,h:hp,j:myJ,...(lunge?{lx:+lunge.to.x.toFixed(2),lz:+lunge.to.z.toFixed(2)}:{})},k=JSON.stringify(o);
  if(k!==lastP){lastP=k;lastSend=0;lastAc=ac;lsX=pos.x;lsZ=pos.z;lsT=nowT;o.ts=Date.now()+offs;o.seq=++moveSeq;
   predictionHistory.set(o.seq,{x:o.x,z:o.z});while(predictionHistory.size>128)predictionHistory.delete(predictionHistory.keys().next().value);
   ns('p',o)}}
 if(isHost){lastMob+=dt;const sig=mobs.map(e=>e.hp+(e.dead>0?'d':'')).join();
  if(lastMob>=.066&&(sig!==lastMs||lastMob>=.2)){const a=mobs.map(e=>[+e.g.position.x.toFixed(1),+e.g.position.z.toFixed(1),e.hp,e.dead>0?1:0,+(e.vx||0).toFixed(2),+(e.vz||0).toFixed(2)]),k=JSON.stringify(a);
   lastMob=0;if(k!==lastMk||sig!==lastMs){lastMk=k;lastMs=sig;ns('m',a)}}}}
function onEv(v){if(!v||v.f===myId||v.t<tJoin-500)return;
 if(v.k==='s'){const m=new THREE.Mesh(new THREE.SphereGeometry(.4,10,8),new THREE.MeshBasicMaterial({color:0xff3030}));
  // Bù trễ đạn: đẩy viên đạn tới vị trí nó đáng ra đã bay tới.
  const lag=Math.max(0,Math.min(.3,(Date.now()+offs-v.t)/1000)),adv=SHOT_SPEED*lag;
  m.position.set(v.x+v.dx*adv,1.2,v.z+v.dz*adv);scene.add(m);shots.push({m,d:new THREE.Vector3(v.dx,0,v.dz),s:adv,vis:1,owner:v.f})}
 else if(v.k==='d'&&v.to===myId&&pdead<=0){floatNum(hero.position.x,hero.position.z,v.d,0,2.8,true);hp=Math.max(0,hp-v.d);updHp();if(hp<=0){pdead=3;hero.visible=false;lunge=null;ultWind=null}}
 else if(v.k==='pi'){passiveImpact(v.sx,v.sy,v.sz,v.ex,v.ez,v.dx,v.dz)}
 else if(v.k==='b'){const r=remotes[v.f];if(r)r.bT=.35;burst(v.x,v.z,v.r,0xff3030,v.fl&&r?r:0,v.d,v.s)}
 else if(v.k==='f')mkFlower(v.x,v.z,1,true,v.sx,v.sz);
 else if(v.k==='fp'){ // đối thủ nhặt bông → xóa bông tương ứng trên máy mình
  for(let i=flowers.length-1;i>=0;i--){const f=flowers[i];
   if((v.id&&f.id===v.id)||(Math.abs(f.x-v.x)<.6&&Math.abs(f.z-v.z)<.6)){
    const fx=f.g.position.x,fz=f.g.position.z;scene.remove(f.g);flowers.splice(i,1);burst(fx,fz,1.8,0xff3030,0,.25,.2)}}
 }
 else if(v.k==='im'){const r=remotes[v.f];if(r){const lag=Math.max(0,Math.min(.3,(Date.now()+offs-v.t)/1000));r.immuneT=Math.max(0,v.d-lag);if(r.immuneT>0)r.immMax=Math.max(r.immMax||0,r.immuneT)}}
 else if(v.k==='uc'){clearFlowers('remote')}

 else if(v.k==='fc'){clearFlowers('remote');
  // Người ném báo đã trúng: xóa viên đạn đang bay của họ (không để xuyên người); nếu trúng mình thì hiện va chạm trên người mình.
  let gone=0;for(let i=shots.length-1;i>=0;i--){const s=shots[i];if(!s.vis||s.owner!==v.f)continue;
   if(v.to===myId){s.m.position.x=pos.x;s.m.position.z=pos.z}
   scene.remove(s.m);if(s.m.geometry)s.m.geometry.dispose();if(s.m.material)s.m.material.dispose();shots.splice(i,1);gone++}
  if(v.to===myId&&pdead<=0){stunPlayer();}if(gone&&v.to===myId&&pdead<=0)spawnDamageImpact({g:hero,bag:0})} // đối thủ trúng địch tạo 3 bông mới → xóa bông cũ
 else if(v.k==='m'&&isHost){const e=mobs[v.i];if(e&&!e.dead)hit(e,v.d,1)}}
async function join(c,mk){
 if(!window.Colyseus?.Client){alert('Không tải được Colyseus');return}
 code=c;$('rj').disabled=$('rn').disabled=$('ro').disabled=true;
 godMode=stillMode=cdOff=false;
 $('btnGod').textContent='Bot bất tử: Tắt';$('btnGod').classList.remove('on');
 $('btnStill').textContent='Bot đứng yên: Tắt';$('btnStill').classList.remove('on');
 $('btnCd').textContent='Hồi chiêu: Bật';$('btnCd').classList.remove('on');
 $('dbg').style.display='none';
 try{
   const cl=new window.Colyseus.Client(CS_URL);
   room=mk?await cl.create(CS_ROOM,{code:c}):await cl.joinOrCreate(CS_ROOM,{code:c});
   myId=room.sessionId;const jl={};
   const calcHost=()=>{let best=null,bj=0;for(const id in jl){const j=jl[id];if(best===null||j<bj||(j===bj&&id<best)){best=id;bj=j}}isHost=best===null||best===myId;updLabel()};
   const proc=(id,d)=>{if(!d||id===myId)return;let r=remotes[id];
    if(!r){r=remotes[id]=mkRemote(id);enemies.push(r);r.g.position.set(d.x,0,d.z);r.g.rotation.y=d.r;r.c=d.c} // vào phòng: không phát lại chiêu cũ
    const sNow=Date.now()+offs,lat=d.ts?Math.max(0,Math.min(.35,(sNow-d.ts)/1000)):0;
    if(d.ts)ping=ping?ping*.85+lat*150:lat*1000;
    const vx=Math.max(-40,Math.min(40,d.vx||0)),vz=Math.max(-40,Math.min(40,d.vz||0));
    // Lưu gói theo mốc thời gian của người gửi; gói đến muộn/sai thứ tự bị bỏ để không giật lùi.
    const t=(d.ts||sNow)/1000,sn=r.snaps,last=sn[sn.length-1];
    if(!last||t>last.t){
     const dl=performance.now()/1000-t; // độ trễ tương đối (không phụ thuộc lệch đồng hồ hai máy)
     if(r.base==null){r.base=dl;r.jit=.015;r.gap=.05;r.dly=.1}
     else if(dl<r.base||dl-r.base>.6)r.base=dl; // gói nhanh nhất = mốc gốc; treo máy/đổi mạng → đồng bộ lại
     else r.base+=(dl-r.base)*.004; // trôi chậm lên để bù lệch tốc độ đồng hồ
     const q=dl-r.base;r.jit+=(q-r.jit)*(q>r.jit?.3:.02); // độ rung mạng: tăng nhanh, giảm chậm
     if(last&&t-last.t<.12)r.gap+=(t-last.t-r.gap)*.1; // nhịp gói thực tế
     sn.push({t,x:d.x,z:d.z,vx,vz,r:d.r,lx:d.lx,lz:d.lz,tp:!!last&&Math.hypot(d.x-last.x,d.z-last.z)>9});while(sn.length>12)sn.shift()}
    if(d.h<r.hp&&r.pend)r.pend=Math.max(0,r.pend-(r.hp-d.h)); // đối soát dự đoán sát thương
    r.hp=d.h;
    if(d.c!==r.c)rAttack(r,d.a,d.c)};
   room.onMessage('p',d=>{const id=d.id,nw=!(id in jl);jl[id]=d.j||0;proc(id,d);if(nw)calcHost()});
   room.onMessage('ack',d=>{
    if(!d||!Number.isSafeInteger(d.seq)||d.seq<=lastAckSeq||!Number.isFinite(d.x)||!Number.isFinite(d.z))return;
    lastAckSeq=d.seq;
    const predicted=predictionHistory.get(d.seq);
    for(const seq of predictionHistory.keys()){if(seq<=d.seq)predictionHistory.delete(seq)}
    if(!predicted)return;
    const dx=d.x-predicted.x,dz=d.z-predicted.z;
    if(Math.hypot(dx,dz)<.001)return;
    pos.x+=dx;pos.z+=dz;correctionX-=dx;correctionZ-=dz;
    if(lunge){lunge.from.x+=dx;lunge.from.z+=dz;lunge.to.x+=dx;lunge.to.z+=dz}
   });
   room.onMessage('leave',id=>{delete jl[id];const r=remotes[id];
    if(r){scene.remove(r.g);scene.remove(r.bars);if(r.stunFx){scene.remove(r.stunFx);disposeObj(r.stunFx)}if(r.slashMesh){scene.remove(r.slashMesh);disposeObj(r.slashMesh)}const i=enemies.indexOf(r);if(i>=0)enemies.splice(i,1);delete remotes[id]}calcHost()});
   room.onMessage('m',v=>{if(isHost)return;if(v){
    // Đối soát dự đoán: máu thật đã giảm thì bớt phần dự đoán tương ứng để không trừ đôi.
    for(let i=0;i<v.length;i++){const m=mobs[i],o=mobT[i];if(m&&m.pend&&o&&v[i]&&o[2]>v[i][2])m.pend=Math.max(0,m.pend-(o[2]-v[i][2]))}
    mobT=v;mobTs=performance.now()}});
   room.onMessage('e',onEv);
   room.onMessage('pong',d=>{if(pongCb)pongCb(d.s)});
   room.onLeave(()=>{if(online){online=false;alert('Mất kết nối với server')}});
   addEventListener('pagehide',()=>{try{room.leave()}catch(e){}});
   await syncClock();
   myJ=tJoin=Date.now()+offs;jl[myId]=myJ;
   const o={x:+pos.x.toFixed(1),z:+pos.z.toFixed(1),r:0,a:'idle',c:0,h:hp,j:myJ};lastP=JSON.stringify(o);o.ts=Date.now()+offs;
   ns('p',o);ns('ready',1); // báo server gửi trạng thái người chơi/quái hiện có
   mobs=enemies.filter(e=>e.mid!=null);online=true;netLock=false;$('net').style.display='none';$('hp').style.display='block';updHp();calcHost();
 }catch(e){alert('Lỗi Colyseus: '+(e&&e.message||e));$('rj').disabled=$('rn').disabled=$('ro').disabled=false;$('dbg').style.display='flex';room=null}}
$('ro').onclick=()=>{$('dbg').style.display='flex';$('rn').disabled=$('rj').disabled=false;netLock=false;$('net').style.display='none';$('hp').style.display='block';updHp();spawnBot()};
$('rn').onclick=()=>{const c=String(1000+Math.floor(Math.random()*9000));$('rc').value=c;join(c,true)};
$('rj').onclick=()=>{const c=$('rc').value.replace(/\D/g,'');if(!c){$('rc').focus();return}join(c)};
$('rc').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')$('rj').click()});
$('rc').addEventListener('keyup',e=>e.stopPropagation());
// Nút debug góc trên trái
$('btnGod').onclick=()=>{godMode=!godMode;$('btnGod').textContent='Bot bất tử: '+(godMode?'Bật':'Tắt');$('btnGod').classList.toggle('on',godMode);if(godMode&&bot){bot.hp=bot.max;if(bot.dead>0){bot.dead=0;bot.g.visible=true;if(bot.bars)bot.bars.visible=true}}};
$('btnStill').onclick=()=>{stillMode=!stillMode;$('btnStill').textContent='Bot đứng yên: '+(stillMode?'Bật':'Tắt');$('btnStill').classList.toggle('on',stillMode)};
$('btnCd').onclick=()=>{cdOff=!cdOff;$('btnCd').textContent='Hồi chiêu: '+(cdOff?'Tắt':'Bật');$('btnCd').classList.toggle('on',cdOff);$('btnCd').blur()};
(function prewarm(){
 const objs=[qAimArrow,qAimCenterLine,uAimArrow,uAimCenterLine,qAimRing,qAimDot,immuneFx,selfStunFx],vis=objs.map(o=>o.visible);
 objs.forEach(o=>o.visible=true);
 try{ren.compile(scene,cam)}catch(_){}
 objs.forEach((o,i)=>o.visible=vis[i]);
})();
loop();
